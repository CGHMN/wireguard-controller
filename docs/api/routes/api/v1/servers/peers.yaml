get:
  summary: "Get listing of all peers of a Wireguard server instance"
  description: "Returns a list of all existing peers of a Wireguard server instance"
  tags:
    - Peers
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../../models/Peer.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance not found"

post:
  summary: "Add new Peer to Wireguard server instance"
  description: "Adds a Peer to a Wireguard server instance"
  tags:
    - "Peers"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
  requestBody:
    description: "Peer data"
    content:
      application/json:
        schema:
          $ref: "../../../../models/Peer.yaml"
  responses:
    200:
      description: "OK, returns the added Peer"
      content:
        application/json:
          schema:
            $ref: "../../../../models/Peer.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance not found"
