get:
  summary: "Get listing of all AllowedIPs of a Wireguard server instance"
  description: "Returns a list of all existing AllowedIP entries of a Wireguard server instance"
  tags:
    - "Server AllowedIPs"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../../models/ServerAllowedIp.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance not found"

post:
  summary: "Add new AllowedIP to Wireguard server instance"
  description: "Adds an AllowedIP entry to a Wireguard server instance, which will be included in client configurations for the server instance"
  tags:
    - "Server AllowedIPs"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
  requestBody:
    description: "AllowedIP entry data"
    content:
      application/json:
        schema:
          $ref: "../../../../models/ServerAllowedIp.yaml"
  responses:
    200:
      description: "OK, returns the added AllowedIP entry"
      content:
        application/json:
          schema:
            $ref: "../../../../models/ServerAllowedIp.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance not found"
