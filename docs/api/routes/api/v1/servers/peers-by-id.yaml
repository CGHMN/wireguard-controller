get:
  summary: "Get single Peer"
  description: "Returns a single Peer by its ID"
  tags:
    - "Peers"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
    - name: peer_id
      in: path
      description: "ID of the Peer"
      required: true
      schema:
        type: integer
        example: 1
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            $ref: "../../../../models/Peer.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Peer not found"

put:
  summary: "Update a Peer"
  description: "Updates a Peer"
  tags:
    - "Peers"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
    - name: peer_id
      in: path
      description: "ID of the Peer"
      required: true
      schema:
        type: integer
        example: 1
  requestBody:
    description: "Peer data"
    content:
      application/json:
        schema:
          $ref: "../../../../models/Peer.yaml"
  responses:
    200:
      description: "OK, returns the updated Peer"
      content:
        application/json:
          schema:
            $ref: "../../../../models/Peer.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Peer not found"

delete:
  summary: "Remove an Peer from a Wireguard server instance"
  description: "Removes an existing Peer from a Wireguard server instance by its ID"
  tags:
    - "Peers"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
    - name: peer_id
      in: path
      description: "ID of the Peer"
      required: true
      schema:
        type: integer
        example: 1
  responses:
    200:
      description: "OK, always returns true"
      content:
        application/json:
          schema:
            type: boolean
            enum:
              - true
            example: true
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Peer not found"
