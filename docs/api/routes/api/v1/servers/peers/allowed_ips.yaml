get:
  summary: "Get listing of all AllowedIPs of a Peer"
  description: "Returns a list of all existing AllowedIP entries of a Peer"
  tags:
    - "Peer AllowedIPs"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
    - name: peer_id
      in: path
      description: "ID of the parent Peer"
      required: true
      schema:
        type: integer
        example: 1
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../../../models/PeerAllowedIp.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance or Peer not found"

post:
  summary: "Add new AllowedIP to Peer"
  description: "Adds an AllowedIP entry to a Peer"
  tags:
    - "Peer AllowedIPs"
  parameters:
    - name: server_id
      in: path
      description: "ID of the parent Wireguard server instance"
      required: true
      schema:
        type: integer
        example: 1
    - name: peer_id
      in: path
      description: "ID of the parent Peer"
      required: true
      schema:
        type: integer
        example: 1
  requestBody:
    description: "AllowedIP entry data"
    content:
      application/json:
        schema:
          $ref: "../../../../../models/PeerAllowedIp.yaml"
  responses:
    200:
      description: "OK, returns the added AllowedIP entry"
      content:
        application/json:
          schema:
            $ref: "../../../../../models/PeerAllowedIp.yaml"
    401:
      description: "Missing or invalid X-API-Key header"
    404:
      description: "Wireguard server instance or Peer not found"
